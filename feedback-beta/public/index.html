<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ComicEngine Reader</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="public-review">
  <div class="page-shell">
    <header>
      <div>
        <p class="brand"><span class="brand-name">ComicEngine</span> <span class="beta-pill">Beta</span></p>
        <h1>Stories</h1>
      </div>
      <div class="status nav-links">
        <span class="muted small" id="whoHint"></span>
        <a class="btn" href="/login.html" id="authLink">Log in</a>
        <button type="button" class="btn" id="logoutBtn" hidden>Log out</button>
      </div>
    </header>
    <section class="story-meta">
      <p class="lede">Pick a comic. Read for fun, open the PDF, or read &amp; rate panels to help us improve.</p>
    </section>
    <section class="comic-grid" id="storyGrid"></section>
  </div>
  <script src="/app.js"></script>
  <script>Home.init();</script>
<footer class="site-footer">
  <p>© 2026 Avinash Nandyala · ComicEngine</p>
  <p class="muted small">AI comic pipeline — beta preview. Built by Avinash (<a href="https://github.com/navinash47" target="_blank" rel="noopener">@navinash47</a>).</p>
</footer>
</body>
</html>
