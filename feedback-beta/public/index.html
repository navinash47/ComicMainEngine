<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ComicEngine Reader</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="public-review">
  <header>
    <div>
      <p class="brand">ComicEngine</p>
      <h1>Stories</h1>
    </div>
    <div class="status nav-links">
      <span class="muted small" id="whoHint"></span>
      <a class="btn" href="/login.html" id="authLink">Log in</a>
      <button type="button" class="btn" id="logoutBtn" hidden>Log out</button>
    </div>
  </header>
  <section class="story-meta">
    <p class="lede">Read a comic, rate each panel, then rate the whole story. Accounts keep your feedback tied to you.</p>
  </section>
  <section class="library-grid" id="storyGrid"></section>
  <script src="/app.js"></script>
  <script>Home.init();</script>
</body>
</html>
