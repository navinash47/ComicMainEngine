<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ComicEngine · Review</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="public-review">
  <header>
    <div>
      <p class="brand">ComicEngine</p>
      <h1>Story review</h1>
    </div>
    <div class="status nav-links">
      <span class="muted small" id="whoHint">Enter your name to start</span>
    </div>
  </header>

  <section class="story-meta">
    <p class="lede">Read a comic, then rate each panel and the whole story. No account — just your name so we can tell feedbacks apart.</p>
    <label class="pe-label" for="displayName">Your name</label>
    <div class="link-row">
      <input id="displayName" type="text" maxlength="80" placeholder="e.g. Priya" style="min-width:14rem;padding:0.5rem 0.65rem;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit" />
      <button type="button" class="btn pe-primary" id="saveName">Save name</button>
    </div>
    <p class="muted small" id="nameStatus"></p>
  </section>

  <section class="library-grid" id="storyGrid"></section>

  <script src="/static/review/review.js"></script>
  <script>ReviewHome.init();</script>
</body>
</html>
