[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comicengine"
version = "0.1.0"
description = "Code-first AI history comic pipeline (onceuponatime)"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.1",
  "pydantic>=2.7",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "anthropic>=0.49",
  "openai>=1.60",
  "google-genai>=1.0",
  "Pillow>=10.4",
  "typer>=0.12",
  "rich>=13.7",
  "fal-client>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
